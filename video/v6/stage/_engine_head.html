<style>

#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0c1411}

#cap,#brand,#chap,#credit,#prog{z-index:20}

.pin{position:absolute;width:0;height:0}
.pin .dot{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 4px rgba(0,0,0,.25)}
.pin .lab{position:absolute;white-space:nowrap;font-size:27px;font-weight:800;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.phone{width:360px;height:740px;border-radius:52px;background:#0f1412;padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#fff}
.phone img{position:absolute;left:0;top:0;width:100%}
.laptop{width:1320px;height:870px;transform:scale(.88);transform-origin:0 0}
.laptop .bezel{position:absolute;left:0;top:0;width:1320px;height:840px;background:#121615;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.laptop .screen{position:absolute;left:20px;top:20px;width:1280px;height:800px;overflow:hidden;border-radius:8px;background:#fff}
.laptop .base{position:absolute;left:-70px;top:834px;width:1460px;height:24px;background:linear-gradient(#d3d8d6,#8c9390);border-radius:0 0 26px 26px}
.zoom{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0}
.zoom img{position:absolute;left:0;top:0;width:1280px;height:800px}
.cursor{position:absolute;left:0;top:0;width:34px;height:42px;z-index:5}
.ripple{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;border:5px solid #2B654F;opacity:0}
.badge{position:absolute;font:800 13px 'Noto Sans','Segoe UI',sans-serif;border-radius:6px;padding:3px 8px;min-width:52px;text-align:center;opacity:0}
.tablet{position:absolute;background:#121615;border-radius:34px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;gap:18px;margin:0 0 14px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:#2B654F;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;margin:5px}
.stat{width:430px}
.paper{background:#fff;padding:16px;border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.45)}
</style>

</head>
